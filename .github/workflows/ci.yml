name: CI

# 触发：推送到受保护分支 / 任意 PR。
on:
  push:
    branches: [main, publish, dev]
  pull_request:

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    # 不依赖任何密钥：集成测试用 MockLLM（零 token、不联网），
    # RAG 嵌入测试走 MockEmbedder，语料为仓库内 fixture，全部离线可跑。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q
