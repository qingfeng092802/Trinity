# 云启智能知识库 · Agent 端到端评测集（主任务集）
#
# 构造原则（设计文档 §5.3）：每条 expected_result 都能回指到某份文档的某一条
# （见每条任务的 source 字段），期望值 = 该条款里的字面数字/术语，**从文档推导，不拍脑袋**。
#
# 事实来源 = 运行中 KB 的 4 份「深圳市云启智能科技有限公司」文档（documents 表 status=ready）：
#   01_员工手册.md / 02_财务报销制度.txt / 03_考勤管理制度.txt / 04_费用标准对照表.html
# 每个期望值均已用 POST /knowledge/search 实检索验证「命中片段里确实出现该值」（见 T01 报告）。
# ⚠️ 不要把 evaluation/fixtures/ 的 4 篇弱电域文档混进来——那是 retrieval_eval 的另一个来源。
#
# 分类（6 类，共 40 条）：single_doc_lookup=12 / cross_doc_consistency=8 /
#   numeric_reasoning=7 / boundary=5 / negative=6 / multi_tool=2
version: 1
name: yunqi-agent-v1
description: 云启智能知识库 · Agent 端到端评测集（规则断言为主，judge 默认关闭）
defaults:
  max_iterations: 3          # 覆盖 settings.max_iterations（默认 5，这里收紧省成本）
  review_threshold: 7
  use_tools: true
  run_judge: false           # 规则断言为主，judge 默认关闭以省成本
  timeout_s: 150
tasks:
  # ------------------------------------------------------------------ 单文档事实检索（12）
  - id: yq-hr-001
    category: single_doc_lookup
    difficulty: easy
    tags: [hr, travel]
    source: "01_员工手册.md 第 6.2 条（住宿标准表）；04_费用标准对照表.html 一（出差住宿费上限标准）"
    prompt: "深圳市云启智能科技有限公司的普通员工到北京出差，住宿费上限是每人每晚多少元？请用一句话回答，给出具体数字。"
    expected_result:
      contains_all: ["450"]
      contains_any:
        - ["450 元", "450元", "每晚 450", "上限 450"]
      regex: '(?<![0-9])450(?![0-9])'
    expected_tools:
      mode: subset
      any_of: [knowledge_search]
      collapse_repeats: true
      allow_extra: true
    max_steps: 5
    max_tool_calls: 6
    max_cost_cny: 0.12
    max_latency_ms: 120000

